<style>
  :root { --bg:#F5F4FB; --surface:#FFFFFF; --ink:#1F1A33; --muted:#5E5873; --border:#E2DFEE; --field:#D6D2E6; --soft:#EDEBF5;
          --coral:#C8402B; --primary:#5B4BC4; --primarySoft:#ECE8FB; --sun:#FFD45C; --mint:#DDF3E8; --green:#1B6B47; --danger:#B42318; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Nunito, system-ui, sans-serif; font-size: 16px; }
  .wrap { max-width: 480px; margin: 0 auto; padding: 0 16px 120px; }
  .top { display: flex; align-items: center; gap: 6px; padding: 12px 0 4px; }
  .top svg { width: 40px; height: 40px; }
  .word { font-weight: 800; font-size: 26px; letter-spacing: -0.3px; }
  .scene { display: flex; justify-content: center; }
  .scene svg { width: 100%; max-width: 380px; height: auto; }
  .hero { background: var(--coral); color: #fff; border-radius: 22px; padding: 22px; margin-top: -8px; }
  .hero .small { font-weight: 600; }
  .hero h1 { margin: 2px 0 0; font-size: 38px; line-height: 1.15; font-weight: 800; }
  .hero .turns { font-size: 21px; font-weight: 700; }
  .hero p { margin: 8px 0 0; line-height: 1.45; }
  .pill-btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; margin-top: 12px; border-radius: 12px;
              background: #fff; color: var(--coral); font-weight: 700; text-decoration: none; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 16px; margin-top: 16px; }
  h2 { margin: 0 0 8px; font-size: 20px; font-weight: 800; }
  label.lbl { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input[type=text] { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--field); padding: 0 14px;
                     font: inherit; color: var(--ink); background: var(--surface); }
  input[type=text]:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; min-height: 52px; border-radius: 14px; border: 1.5px solid var(--border); background: var(--surface); color: var(--ink);
         font: inherit; font-weight: 700; cursor: pointer; padding: 8px 12px; }
  .btn.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  .btn.dark { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.outline { background: transparent; border-color: var(--ink); }
  .btn.picked { background: var(--mint); color: var(--green); border-color: var(--green); }
  .btn:disabled { opacity: .5; }
  .stepper { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .stepper .ctl { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 48px; height: 48px; border-radius: 12px; border: 1.5px solid var(--border); background: var(--surface); font: inherit; font-size: 20px; font-weight: 800; cursor: pointer; }
  .stepper b { min-width: 28px; text-align: center; font-size: 20px; }
  .ok { color: var(--green); font-weight: 600; margin-top: 10px; }
  .muted { color: var(--muted); }
  .check { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-top: 8px; cursor: pointer; }
  .check input { width: 22px; height: 22px; accent-color: var(--green); }
  .gift { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; margin-top: 10px; }
  .gift.sel { border: 2px solid var(--green); }
  .gift .name { font-weight: 700; font-size: 17px; margin: 4px 0; }
  .gift .meta { display: flex; gap: 12px; flex-wrap: wrap; color: var(--muted); margin-bottom: 10px; }
  .gift .meta a { color: var(--primary); font-weight: 600; }
  .tag { display: inline-block; background: var(--sun); color: var(--ink); font-weight: 700; font-size: 12px; border-radius: 8px; padding: 2px 8px; }
  .taken { display: flex; justify-content: space-between; background: var(--soft); color: var(--muted); border-radius: 12px; padding: 12px; margin-top: 8px; }
  .taken s { flex: 1; }
  .label-up { font-weight: 800; font-size: 13px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); margin-top: 18px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg); border-top: 1px solid var(--border); padding: 10px 16px calc(14px + env(safe-area-inset-bottom)); }
  .bar .in { max-width: 480px; margin: 0 auto; }
  .err { color: var(--danger); text-align: center; margin-bottom: 6px; min-height: 0; }
  .center { text-align: center; }
  .tick { width: 64px; height: 64px; border-radius: 32px; background: var(--mint); color: var(--green); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; margin: 16px auto 6px; }
  .promo { text-align: center; color: var(--muted); font-size: 14px; margin-top: 28px; }
  .promo b { color: var(--primary); }
  .langs { display: flex; gap: 6px; justify-content: flex-end; }
  .langs button { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; min-height: 36px; padding: 0 10px; font: inherit; font-size: 13px; font-weight: 700; color: var(--muted); cursor: pointer; }
  .langs button.on { color: var(--primary); border-color: var(--primary); background: var(--primarySoft); }
  .cta { background: linear-gradient(135deg, #5B4BC4 0%, #7B5BD6 60%, #C2416A 130%); color: #fff; border-radius: 22px; padding: 20px; margin-top: 22px; position: relative; overflow: hidden; }
  .cta .dots { position: absolute; right: -6px; top: -6px; width: 120px; height: 90px; opacity: .9; }
  .cta h3 { margin: 0 0 6px; font-size: 22px; line-height: 1.2; font-weight: 800; max-width: 85%; }
  .cta p { margin: 0 0 14px; line-height: 1.45; opacity: .95; }
  .cta .go { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 54px; border-radius: 14px; background: #fff; color: #3E2F9E; font-weight: 800; font-size: 17px; text-decoration: none; }
  .cta .soon { display: inline-block; margin-top: 10px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,.18); border-radius: 999px; padding: 4px 10px; }
  .cta.small { padding: 16px; }
  .cta.small h3 { font-size: 18px; }
  .land h1 { font-size: 30px; line-height: 1.2; margin: 6px 0 8px; font-weight: 800; }
  .land .lead { color: var(--muted); line-height: 1.5; margin: 0 0 12px; }
  .feat { display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-top: 8px; font-weight: 700; }
  .feat i { flex: none; width: 30px; height: 30px; border-radius: 15px; background: var(--mint); color: var(--green); display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 800; }
.scene .adultonly{display:none}.scene.no-kids .kidonly{display:none}.scene.no-kids .adultonly{display:inline}.scene.no-candles .candles{display:none}
</style>

function formatWhen(lang, iso, time) {
  const s = T[lang]; const [y, m, d] = iso.split('-').map(Number);
  const wd = s.weekdays[new Date(y, m - 1, d).getDay()]; const cap = wd.charAt(0).toUpperCase() + wd.slice(1);
  if (lang === 'az') return `${d} ${s.months[m - 1]}, ${wd} · saat ${time}`;
  return `${cap}, ${d} ${s.months[m - 1]} · ${time}`;
}

// ---- Helpers -----------------------------------------------------------------
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = (u) => (/^https?:\/\//i.test(u || '') ? u : '');
const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

async function rpc(fn, args) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  if (!res.ok) throw new Error(`rpc ${fn} ${res.status}`);
  return res.json();
}

const qs = new URLSearchParams(location.search);
const slug = qs.get('i') || '';
// Personal link from the host's guest list: ?g=<name>. It pre-fills the name so the reply matches the host's list.
const invited = (qs.get('g') || '').trim().slice(0, 80);
const browserLang = (navigator.language || 'az').slice(0, 2);
let lang = ['az', 'ru', 'en'].includes(browserLang) ? browserLang : 'az';
let party = null;
let st = { name: invited || store.get('kf.name') || '', answer: null, kids: 1, optIn: false, picked: [], done: false, busy: false, error: '' };

function wordmark() {
  const cols = ['#C8402B', '#5B4BC4', '#1B6B47', '#B26A00', '#3A7BB8', '#C2416A', '#5B4BC4', '#C8402B'];
  $('word').innerHTML = 'konfetti'.split('').map((c, i) => `<span style="color:${cols[i]}">${c}</span>`).join('');
}
function langButtons() {
  $('langs').innerHTML = ['az', 'ru', 'en'].map((l) => `<button class="${l === lang ? 'on' : ''}" data-lang="${l}" aria-pressed="${l === lang}">${l.toUpperCase()}</button>`).join('');
}
function mapsUrl(p) {
  if (p.lat != null && p.lng != null) return `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  if (safeUrl(p.map_link)) return p.map_link;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.place, p.address].filter(Boolean).join(', '))}`;
}

async function load(guestName) {
  party = await rpc('get_invitation', { p_slug: slug, p_guest: guestName || null });
  if (party && !store.get('kf.lang.' + slug)) lang = party.lang; // the invitation's own language, unless the guest switched
}

function render() {
  document.documentElement.lang = lang;
  langButtons();
  const s = T[lang], x = EXTRA[lang];
  if (!party) { $('app').innerHTML = slug ? `<p class="center muted" style="margin-top:40px">${esc(x.notFound)}</p>${ctaCard(false)}` : landing(); $('bar').hidden = true; return; }
  const p = party;
  const showGifts = st.answer === 'yes' || (st.answer === 'no' && st.optIn);
  const available = p.gifts.filter((g) => !g.taken || g.mine);
  const takenByOthers = p.gifts.filter((g) => g.taken && !g.mine);
  const price = (v) => (v == null ? '' : `${Number(v)} ₼`);

  let html = `<div class="scene${isKids() ? '' : ' no-kids'}${isKids() || occ() === 'birthday' ? '' : ' no-candles'}">${SCENE}</div>
  <section class="hero">
    <div class="small">${esc(FN.occInvite[lang][occ()] || s.youreInvited)}</div>
    <h1>${esc(p.child_name)}</h1>
    ${hasAge() ? `<div class="turns">${esc(FN.turnsLine[lang](p.age))}</div>`
      : occ() !== 'newyear' && occ() !== 'other' ? `<div class="turns">${esc(FN.occasions[lang][occ()])}</div>` : ''}
    <p>${esc(formatWhen(lang, p.date, p.time))}<br>${esc([p.place, p.address].filter(Boolean).join(', '))}</p>
    ${p.message ? `<p>${esc(p.message)}</p>` : ''}
    <a class="pill-btn" href="${esc(mapsUrl(p))}" target="_blank" rel="noopener">${esc(s.openMap)}</a>
  </section>`;

  if (st.done) {
    const mine = p.gifts.filter((g) => g.mine);
    html += `<div class="tick" aria-hidden="true">✓</div>
    <h2 class="center" style="font-size:28px">${esc(s.thanksTitle)}</h2>
    <p class="center muted">${esc(st.answer === 'yes' ? (isKids() ? FN.thanksComing[lang] : FN.thanksComingP[lang])(st.kids) : s.thanksNotComing)}</p>
    <div class="card"><div class="muted" style="font-weight:700;font-size:13px">${esc(s.youBring)}</div>
      ${mine.length ? mine.map((g) => `<div class="name" style="font-weight:700;font-size:17px;margin-top:6px">${esc(g.name)}</div><div class="muted">${esc(price(g.price))}${safeUrl(g.link) ? ` · <a href="${esc(g.link)}" target="_blank" rel="noopener" style="color:var(--primary)">${esc(s.viewInShop)}</a>` : ''}</div>`).join('') : `<div style="margin-top:6px">${esc(s.noGiftChosen)}</div>`}
    </div>
    ${st.answer === 'yes' ? `<button class="btn dark" style="width:100%;margin-top:16px" id="ics">${esc(s.addToCalendar)}</button><p class="center muted" style="font-size:13px">${esc(s.calendarHint)}</p>` : ''}
    <button class="btn outline" style="width:100%;margin-top:10px" id="change">${esc(s.changeAnswer)}</button>
    ${ctaCard(false)}`;
  } else {
    html += `<div class="card">
      ${invited ? `<h2 style="margin-bottom:4px">${esc(GREET[lang](invited))}</h2><p class="muted" style="margin:0 0 10px">${esc(GREET_SUB[lang])}</p>` : ''}
      <label class="lbl" for="name">${esc(s.yourName)}</label>
      <input type="text" id="name" autocomplete="name" placeholder="${esc(s.yourNamePh)}" value="${esc(st.name)}">
    </div>
    <div class="card">
      <h2>${esc(s.willYouCome)}</h2>
      <div class="row">
        <button class="btn ${st.answer === 'yes' ? 'on' : ''}" data-answer="yes" aria-pressed="${st.answer === 'yes'}">${esc(s.yesCome)}</button>
        <button class="btn ${st.answer === 'no' ? 'on' : ''}" data-answer="no" aria-pressed="${st.answer === 'no'}">${esc(s.noCome)}</button>
      </div>
      ${st.answer === 'yes' ? `<div class="stepper"><span>${esc(isKids() ? s.howManyKids : FN.howManyPeople[lang])}</span><div class="ctl"><button data-kids="-1" aria-label="−">−</button><b>${st.kids}</b><button data-kids="1" aria-label="+">+</button></div></div><div class="ok">${esc(s.seeYou)}</div>` : ''}

    </div>`;
    if (showGifts) {
      html += `<h2 style="margin-top:22px">${esc(s.giftOptional)}</h2><p class="muted" style="margin:0">${esc(s.pickGiftHint)}</p>`;
      if (!available.length) html += `<p class="muted">${esc(s.allTaken)}</p>`;
      html += available.map((g) => {
        const on = st.picked.includes(g.id);
        return `<div class="gift ${on ? 'sel' : ''}">
          ${g.wanted ? `<span class="tag">${esc(s.mostWanted)}</span>` : ''}

          <div class="meta">${g.price != null ? `<span>${esc(price(g.price))}</span>` : ''}${safeUrl(g.link) ? `<a href="${esc(g.link)}" target="_blank" rel="noopener">${esc(s.viewInShop)}</a>` : ''}</div>
          <button class="btn ${on ? 'picked' : 'dark'}" style="width:100%" data-gift="${esc(g.id)}" aria-pressed="${on}">${on ? '✓ ' + esc(s.selected) : esc(s.illBring)}</button>
        </div>`;
      }).join('');
      if (takenByOthers.length) html += `<div class="label-up">${esc(s.alreadyTaken)}</div>` + takenByOthers.map((g) => `<div class="taken"><s>${esc(g.name)}</s><span>${esc(s.taken)}</span></div>`).join('');
    }
  }
  if (!st.done) html += ctaCard(true);
  $('app').innerHTML = html;
  $('bar').hidden = st.done;
  $('submit').textContent = s.submitReply;
  $('submit').disabled = st.busy;
  $('err').textContent = st.error;
}

// ---- Events ------------------------------------------------------------------
document.addEventListener('input', (e) => { if (e.target.id === 'name') { st.name = e.target.value; st.error = ''; $('err').textContent = ''; } });
document.addEventListener('change', (e) => { if (e.target.id === 'optin') { st.optIn = e.target.checked; render(); } });
document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang) { lang = b.dataset.lang; store.set('kf.lang.' + slug, lang); return render(); }
  if (b.dataset.answer) { st.answer = b.dataset.answer; st.error = ''; return render(); }
  if (b.dataset.kids) { st.kids = Math.min(9, Math.max(1, st.kids + Number(b.dataset.kids))); return render(); }
  if (b.dataset.gift) { const id = b.dataset.gift; st.picked = st.picked.includes(id) ? st.picked.filter((x) => x !== id) : [...st.picked, id]; st.error = ''; return render(); }
  if (b.id === 'change') { st.done = false; return render(); }
  if (b.id === 'ics') return downloadIcs();
  if (b.id === 'submit') return submit();
});

async function submit() {
  const s = T[lang];
  const name = st.name.trim();
  if (!name) { st.error = s.enterNameFirst; return render(); }
  if (!st.answer) { st.error = s.chooseRsvpFirst; return render(); }
  const showGifts = st.answer === 'yes' || (st.answer === 'no' && st.optIn);
  st.busy = true; st.error = ''; render();
  try {
    const r = await rpc('submit_reply', { p_slug: slug, p_guest: name, p_coming: st.answer === 'yes', p_kids: st.answer === 'yes' ? st.kids : 0, p_gift_ids: showGifts ? st.picked : [] });
    store.set('kf.name', name);
    await load(name);
    if (r && r.taken && r.taken.length) {
      st.picked = party.gifts.filter((g) => g.mine).map((g) => g.id);
      st.error = s.giftJustTaken;
    } else {
      st.done = true;
    }
  } catch (err) {
    st.error = s.errNetwork;
  }
  st.busy = false;
  render();
  if (st.done) window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Occasion helpers. Invitations made before occasions existed are kids' birthdays.
const OCCS = ['kids', 'birthday', 'wedding', 'baby', 'home', 'newyear', 'other'];
const occ = () => (party && OCCS.includes(party.occasion) ? party.occasion : 'kids');
const isKids = () => occ() === 'kids';
const hasAge = () => (occ() === 'kids' || occ() === 'birthday') && Number(party.age) > 0;
function calTitle() {
  const p = party, o = occ();
  if (hasAge()) return FN.calendarTitle[lang](p.child_name, p.age);
  if (o === 'other') return p.child_name;
  return `${FN.occasions[lang][o]}: ${p.child_name}`;
}

function downloadIcs() {
  const p = party; const [y, m, d] = p.date.split('-').map(Number); const [hh, mm] = p.time.split(':').map(Number);
  const pad = (n) => String(n).padStart(2, '0');
  const start = `${y}${pad(m)}${pad(d)}T${pad(hh)}${pad(mm)}00`;
  const endD = new Date(y, m - 1, d, hh + 3, mm);
  const end = `${endD.getFullYear()}${pad(endD.getMonth() + 1)}${pad(endD.getDate())}T${pad(endD.getHours())}${pad(endD.getMinutes())}00`;
  const clean = (t) => String(t).replace(/[\\,;]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Konfetti//AZ', 'BEGIN:VEVENT', `UID:${slug}@konfetti`, `DTSTAMP:${start}`,
    `DTSTART:${start}`, `DTEND:${end}`, `SUMMARY:${clean(calTitle())}`,
    `LOCATION:${clean([p.place, p.address].filter(Boolean).join(', '))}`, `DESCRIPTION:${clean(mapsUrl(p))}`,
    'BEGIN:VALARM', 'TRIGGER:-P1D', 'ACTION:DISPLAY', 'DESCRIPTION:Reminder', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics], { type: 'text/calendar' }));
  a.download = `${EXTRA[lang].icsName}.ics`; document.body.appendChild(a); a.click(); a.remove();
}

// ---- Start -------------------------------------------------------------------
(async () => {
  wordmark(); langButtons();
  $('loading').textContent = EXTRA[lang].loading;
  if (!slug) { party = null; return render(); }
  try {
    await load(st.name || null);
    const saved = store.get('kf.lang.' + slug); if (saved) lang = saved;
    if (party && party.my_reply) { // returning guest: show their saved answer
      st.answer = party.my_reply.coming ? 'yes' : 'no';
      st.kids = party.my_reply.kids || 1;
      st.picked = party.gifts.filter((g) => g.mine).map((g) => g.id);
      st.optIn = !party.my_reply.coming && st.picked.length > 0;
      st.done = true;
    }
    document.title = party ? `${party.child_name} — Konfetti` : 'Konfetti';
  } catch {
    $('app').innerHTML = `<p class="center muted" style="margin-top:40px">${esc(T[lang].errNetwork)}</p>`;
    return;
  }
  render();
})();
</script>
